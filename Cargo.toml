[package]
name = "studio-2016"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license = "Apache-2.0"
description = "Offline research runtime for Roblox Studio macOS 0.255.0.82159"

[dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["std"] }
roxmltree = "=0.21.1"
sha2 = "=0.10.9"
iced-x86 = { version = "=1.21.0", default-features = false, features = ["std", "decoder"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "metal", "wgsl"] }
pollster = "=1.0.1"
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
# Dev panel only (`--features dev`); not part of the product build.
egui = { version = "=0.37.0", optional = true, default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "=0.37.0", optional = true, default-features = false }
egui-winit = { version = "=0.37.0", optional = true, default-features = false }

[features]
dev = ["dep:egui", "dep:egui-wgpu", "dep:egui-winit"]

[lints.rust]
unsafe_code = "forbid"
